<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 소개 페이지</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <a href="#home">메인 홈</a>
    <a href="#gallery">장소 갤러리</a>
    <a href="#contact">상세 안내</a>
  </nav>

  <section id="home">
    <h1>환영합니다!</h1>
    <p>위의 '장소 갤러리' 메뉴를 클릭하면 아래로 부드럽게 스와이프됩니다.</p>
  </section>

  <section id="gallery">
    <h2>장소 둘러보기</h2>
    <p>탭을 눌러 장소를 선택하고, 좌우 화살표를 눌러 사진을 넘겨보세요.</p>
    
    <div class="tab-container">
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="openTab(event, 'place1')">A 장소</button>
        <button class="tab-btn" onclick="openTab(event, 'place2')">B 장소</button>
      </div>

      <div id="place1" class="tab-content active place1">
        <div class="swiper mySwiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">A 장소 - 첫 번째 사진</div>
            <div class="swiper-slide">A 장소 - 두 번째 사진</div>
            <div class="swiper-slide">A 장소 - 세 번째 사진</div>
          </div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-pagination"></div>
        </div>
      </div>

      <div id="place2" class="tab-content place2">
        <div class="swiper mySwiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">B 장소 - 첫 번째 사진</div>
            <div class="swiper-slide">B 장소 - 두 번째 사진</div>
            <div class="swiper-slide">B 장소 - 세 번째 사진</div>
          </div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="contact">
    <h2>상세 안내</h2>
    <p>콘텐츠에 대한 추가적인 설명이 들어가는 공간입니다.</p>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <script>
    let swiperInstance = null;

    // 슬라이더(캐러셀) 초기화 함수
    function initSwiper() {
      if (swiperInstance !== null) {
        swiperInstance.destroy(true, true); // 기존 인스턴스 초기화
      }
      // 활성화된 탭 안의 swiper만 새로 세팅
      swiperInstance = new Swiper('.tab-content.active .swiper', {
        loop: true, // 무한 반복
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
      });
    }

    // 탭 전환 로직
    function openTab(evt, tabId) {
      // 모든 콘텐츠 숨기기
      const tabContents = document.querySelectorAll('.tab-content');
      tabContents.forEach(content => content.classList.remove('active'));

      // 모든 버튼 비활성화
      const tabBtns = document.querySelectorAll('.tab-btn');
      tabBtns.forEach(btn => btn.classList.remove('active'));

      // 클릭한 탭과 콘텐츠만 활성화
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');

      // 탭이 바뀔 때마다 슬라이더 버그가 나지 않도록 재시작
      initSwiper();
    }

    // 웹페이지 로딩 시 최초 1회 슬라이더 실행
    window.onload = function() {
      initSwiper();
    };
  </script>
</body>
</html>
