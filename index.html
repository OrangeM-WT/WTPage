<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orange Marmalade</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <h1>Orange Marmalade</h1>
    <p>OrangeMarmalade 콘텐츠 리스트</p>
  </header>

  <main class="grid-container">
    
    <a href="test/" class="content-card">
      <div class="card-image">
        <img src="test/main-thumb.png" alt="콘텐츠 1 섬네일" onerror="this.src='https://via.placeholder.com/400x250?text=Ready+for+Image'">
      </div>
      <div class="card-body">
        <h3 class="card-title">첫 번째 콘텐츠 이름</h3>
        <p class="card-desc">여기에 콘텐츠를 간단하게 요약하는 소개 문구를 적어주세요.</p>
      </div>
    </a>

    <a href="sample/" class="content-card">
      <div class="card-image">
        <img src="sample/main-thumb.png" alt="콘텐츠 2 섬네일" onerror="this.src='https://via.placeholder.com/400x250?text=Ready+for+Image'">
      </div>
      <div class="card-body">
        <h3 class="card-title">두 번째 콘텐츠 이름</h3>
        <p class="card-desc">두 번째 콘텐츠에 대한 매력적인 설명을 적는 공간입니다.</p>
      </div>
    </a>

    </main>

  <footer class="main-footer">
    <p>© 2026 OrangeM-WT. All rights reserved.</p>
  </footer>

</body>
</html>
