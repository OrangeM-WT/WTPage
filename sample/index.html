<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 상세 소개</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-container">
    
    <div class="scroll-content">

      <nav class="custom-nav">
        <a href="#home">홈</a>
        <a href="#gallery">갤러리</a>
        <a href="#contact">안내</a>
      </nav>

      <section id="home">
        <h1 class="glow-title">환영합니다</h1>
        <p class="sub-text">아래로 스크롤 하거나 메뉴를 눌러 장소를 확인해 보세요.</p>
      </section>

      <section id="gallery">
        <h2 class="section-title">장소 둘러보기</h2>
        
        <div class="tab-container">
          <div class="tab-buttons">
            <button class="tab-btn active" onclick="openTab(event, 'place1')">A 장소</button>
            <button class="tab-btn" onclick="openTab(event, 'place2')">B 장소</button>
          </div>

          <div id="place1" class="tab-content active place1">
            <div class="swiper mySwiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">A 장소 - 사진 1</div>
                <div class="swiper-slide">A 장소 - 사진 2</div>
                <div class="swiper-slide">A 장소 - 사진 3</div>
              </div>
              <div class="swiper-button-next"></div>
              <div class="swiper-button-prev"></div>
              <div class="swiper-pagination"></div>
            </div>
          </div>

          <div id="place2" class="tab-content place2">
            <div class="swiper mySwiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">B 장소 - 사진 1</div>
                <div class="swiper-slide">B 장소 - 사진 2</div>
                <div class="swiper-slide">B 장소 - 사진 3</div>
              </div>
              <div class="swiper-button-next"></div>
              <div class="swiper-button-prev"></div>
              <div class="swiper-pagination"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="contact">
        <h2 class="section-title">상세 안내</h2>
        <p class="sub-text">콘텐츠에 대한 추가적인 설명이 들어가는 공간입니다.</p>
      </section>

    </div> </div> <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <script>
    let swiperInstance = null;

    function initSwiper() {
      if (swiperInstance !== null) {
        swiperInstance.destroy(true, true);
      }
      swiperInstance = new Swiper('.tab-content.active .swiper', {
        loop: true,
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
      });
    }

    function openTab(evt, tabId) {
      const tabContents = document.querySelectorAll('.tab-content');
      tabContents.forEach(content => content.classList.remove('active'));

      const tabBtns = document.querySelectorAll('.tab-btn');
      tabBtns.forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');

      initSwiper();
    }

    window.onload = function() {
      initSwiper();
    };
  </script>
</body>
</html>
